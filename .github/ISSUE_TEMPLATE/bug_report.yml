name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: ordo version
      description: The commit you built from, or the date you installed ordo.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2 / macOS 15.5 / Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: The terminal emulator. On Linux also the window manager or compositor, and X11 or Wayland.
      placeholder: "Windows Terminal 1.22"
    validations:
      required: true
  - type: input
    id: bun
    attributes:
      label: Bun version
      description: The output of `bun --version`.
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: "ordo spawn --agent claude --name legatus"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Screenshots help for layout problems.
      render: text
